# The GitLab host is a short internal name that resolves only via the corporate
# DNS search suffix. Containers do not inherit the host's search list, so it is
# declared here or "nuohub" fails with ENOTFOUND.
x-dns: &dns
  dns_search:
    - dsone.3ds.com
  # Docker defaults to ndots:0, which queries a dotless name literally and never
  # appends the search list, so "nuohub" alone would fail.
  dns_opt:
    - ndots:1

services:
  gitlab-zendesk-prod:
    <<: *dns
    build: .
    image: gitlab-zendesk-prod:latest
    working_dir: /app
    env_file:
      - .env
    entrypoint: ["/app/entrypoint.sh"]
    command: ["bun", "start"]
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./logs:/app/logs
  gitlab-zendesk-dev:
    <<: *dns
    build: .
    image: gitlab-zendesk-dev:latest
    working_dir: /app
    env_file:
      - .env
    entrypoint: ["/app/entrypoint.sh"]
    command: ["bun", "dev"]
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./logs:/app/logs
      # bun dev runs with --watch, so edits on the host apply without a rebuild.
      - ./index.ts:/app/index.ts
      - ./zendesk.ts:/app/zendesk.ts
      - ./gitlab.ts:/app/gitlab.ts
      - ./gitlabRef.ts:/app/gitlabRef.ts
      - ./changeNote.ts:/app/changeNote.ts
  gitlab-zendesk-test:
    build: .
    image: gitlab-zendesk-test:latest
    working_dir: /app
    env_file:
      - .env
    command: ["bun", "test", "tests/unit"]
  gitlab-zendesk-health:
    <<: *dns
    build: .
    image: gitlab-zendesk-health:latest
    working_dir: /app
    env_file:
      - .env
    entrypoint: ["/app/entrypoint.sh"]
    command: ["bun", "health-check.ts"]
